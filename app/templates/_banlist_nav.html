<div class="banlist-nav-box">
    <div class="banlist-nav-title">该年全部禁卡表</div>
    {% if year_ban_lists %}
        <div class="banlist-nav">
            {% for ban_list in year_ban_lists %}
                <a
                    class="banlist-nav-item {% if selected_effective_date == ban_list.effective_date.isoformat() %}active{% endif %}"
                    href="{{ url_for('public.main_page', mode=selected_mode, region=selected_region, year=selected_year, effective_date=ban_list.effective_date.isoformat()) }}"
                >{{ ban_list.effective_date.isoformat() }}</a>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty-row">本年暂无禁卡表</div>
    {% endif %}
</div>
