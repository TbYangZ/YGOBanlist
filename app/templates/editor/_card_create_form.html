<section class="filter-box">
    <h2 class="section-title">添加卡片</h2>
    <form method="POST" action="{{ url_for('editor.edit_banlist_card') }}">
        {% include "editor/_context_fields.html" %}
        <input type="hidden" name="operation" value="add">
        <div class="form-row">
            <div class="form-group">
                <label>CID</label>
                <input type="number" name="cid" min="1">
            </div>
            <div class="form-group">
                <label>卡名</label>
                <input type="text" name="name">
            </div>
            <div class="form-group">
                <label>之前状态</label>
                <select name="old_status" class="status-select">
                    {% for value, label in status_map.items() %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>新的状态</label>
                <select name="new_status" class="status-select">
                    {% for value, label in status_map.items() %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group button-group">
                <button type="submit" class="btn-primary">添加或更新</button>
            </div>
        </div>

        <div class="form-row notes-row">
            <div class="form-group upload-field upload-field-file">
                <label>备注</label>
                <textarea name="notes" class="notes-textarea notes-textarea-compact" rows="2" placeholder="可选"></textarea>
            </div>
        </div>
    </form>
</section>
