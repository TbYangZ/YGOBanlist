<div class="filter-box">
    <form method="GET" action="{{ url_for('public.main_page') }}">
        <div class="form-row">
            <div class="form-group">
                <label>年份</label>
                <select name="year">
                    {% for year in year_options %}
                    <option value="{{ year }}" {% if year == selected_year %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>环境</label>
                <select name="region">
                    {% for value, label in region_map.items() %}
                    <option value="{{ value }}" {% if value == selected_region %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>查看类型</label>
                <select name="mode">
                    <option value="changes" {% if selected_mode == "changes" %}selected{% endif %}>变化列表</option>
                    <option value="full" {% if selected_mode == "full" %}selected{% endif %}>完整禁卡表</option>
                </select>
            </div>

            <div class="form-group button-group">
                <button type="submit" class="btn-primary">查询</button>
            </div>
        </div>
    </form>
</div>
